name: ci

# Lint and tests without network, on synthetic data and on the versioned counts
# and results (no raw data in CI), then the note is compiled and published as an
# artefact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  note:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the note (LaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: note.tex
      - uses: actions/upload-artifact@v4
        with:
          name: note
          path: report/note.pdf
