[project]
name = "nicu-access-brazil"
version = "0.1.0"
description = "Where should Brazil open its next neonatal ICUs? Access of very-low-birth-weight births, 2006-2025, and a maximal covering location model."
readme = "README.md"
license = "MIT"
authors = [{ name = "Paulianne Fontoura" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pysus==2.11.4",
    "pyreaddbc>=2.0.4",
    "dbfread==2.0.7",
    "duckdb>=1.4,<2",
    "pandas>=2.2,<3",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "scipy>=1.14",
    "typer>=0.24.1,<0.25",
]

[project.scripts]
nicu = "nicu.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nicu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:dateutil.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
